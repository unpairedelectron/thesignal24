          maxLength: 80
        kind:
          $ref: "#/components/schemas/CommunityPostKind"
        topic:
          $ref: "#/components/schemas/CommunityTopic"
        state:
          type: ["string", "null"]
          maxLength: 80
        title:
          type: string
          minLength: 4
          maxLength: 180
        body:
          type: string
          minLength: 10
          maxLength: 10000
        linkUrl:
          type: ["string", "null"]
          format: uri
      required: [authorName, kind, topic, title, body]
    CommunityPost:
      allOf:
        - $ref: "#/components/schemas/CommunityPostInput"
        - type: object
          properties:
            id:
              type: integer
            likeCount:
              type: integer
            replyCount:
              type: integer
            likedByViewer:
              type: boolean
            createdAt:
              type: string
              format: date-time
          required: [id, likeCount, replyCount, likedByViewer, createdAt]
    CommunityReplyInput:
      type: object
      properties:
        authorName:
          type: string
          minLength: 2
          maxLength: 80
        body:
          type: string
          minLength: 2
          maxLength: 5000
      required: [authorName, body]
    CommunityReply:
      allOf:
        - $ref: "#/components/schemas/CommunityReplyInput"
        - type: object
          properties:
            id:
              type: integer
            postId:
              type: integer
            createdAt:
              type: string
              format: date-time
          required: [id, postId, createdAt]
    CommunityPostList:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/CommunityPost"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/CommunityTopic"
        states:
          type: array
          items:
            type: string
      required: [posts, topics, states]
    CommunityPostDetail:
      type: object
      properties:
        post:
          $ref: "#/components/schemas/CommunityPost"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/CommunityReply"
      required: [post, replies]
    CommunityLikeResponse:
      type: object
      properties:
