openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: publication
    description: Daily issue and story operations
  - name: newsletter
    description: Newsletter subscription operations
  - name: live desk
    description: Curated external monitoring feed
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /issues/current:
    get:
      operationId: getCurrentIssue
      tags: [publication]
      summary: Get the current published issue
      responses:
        "200":
          description: Current published issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIssue"
        "404":
          description: No published issue exists
  /updates/live:
    get:
      operationId: getLiveUpdates
      tags: [live desk]
      summary: Get the current source monitoring feed
      description: Returns recent external feed items for monitoring. These are not published Signal 24 records and require editorial review before publication.
      responses:
        "200":
          description: Current monitoring items and feed health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveUpdatesResult"
  /editor/issues/current:
    get:
      operationId: getEditorialIssue
      tags: [publication]
      summary: Get the current issue with editorial workflow fields
      responses:
        "200":
          description: Current issue for the editorial desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIssue"
        "404":
          description: No issue exists
  /archive:
    get:
      operationId: getArchive
      tags: [publication]
      summary: Browse the reservation archive
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: topic
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Topic"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StoryKind"
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Published reservation reporting and research archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveResult"
  /policies:
    get:
      operationId: getPolicies
      tags: [publication]
      summary: Search the source-linked policy ledger
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: effectiveFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: effectiveTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Source-linked policy ledger records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResult"
  /policies/{slug}:
    get:
      operationId: getPolicy
      tags: [publication]
      summary: Get a policy ledger record by permanent slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy ledger record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRecord"
        "404":
          description: Policy record not found
  /sitemap.xml:
    get:
      operationId: getPublicationSitemap
      tags: [publication]
      summary: Get the indexable publication sitemap
      responses:
        "200":
          description: XML sitemap containing only meaningful published records
          content:
            application/xml:
              schema:
                type: string
  /issues:
    post:
      operationId: createIssue
      tags: [publication]
      summary: Create a daily issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
      responses:
        "201":
          description: Created issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
  /issues/{issueId}/publish:
    post:
      operationId: publishIssue
      tags: [publication]
      summary: Publish an issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Published issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Issue not found
        "409":
          description: Issue contains records that have not passed editorial review
  /stories/{storyId}:
    get:
      operationId: getStory
      tags: [publication]
      summary: Get a story by id
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: Story details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Story not found
    put:
      operationId: updateStory
      tags: [publication]
      summary: Update a story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "200":
          description: Updated story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Story not found
  /stories/{storyId}/revisions:
    get:
      operationId: getStoryRevisions
      tags: [publication]
      summary: Get the revision history for a story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: Revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRevisions"
        "404":
          description: Story not found
  /stories:
    post:
      operationId: createStory
      tags: [publication]
      summary: Add a story to an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
  /newsletter:
    post:
      operationId: subscribeToNewsletter
      tags: [newsletter]
      summary: Subscribe an email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "201":
          description: Newsletter subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterStatus"
  /newsletter/status:
    get:
      operationId: getNewsletterStatus
      tags: [newsletter]
      summary: Check whether an email is subscribed
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Newsletter subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterStatus"
components:
  parameters:
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Topic:
      type: string
      enum: [Latest, Courts & Policy, States, History, Ground Reports, Data & Notes]
    StoryKind:
      type: string
      enum: [Article, Paper note, Archive, Explainer]
    StoryWorkflowStatus:
      type: string
      enum: [draft, review, scheduled, published, archived]
    VerificationStatus:
      type: string
      enum: [unverified, source-linked, verified]
    Issue:
      type: object
      properties:
        id:
          type: integer
        issueDate:
          type: string
          format: date
        issueNumber:
          type: integer
        status:
          type: string
          enum: [draft, published]
        title:
          type: string
        intro:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, issueDate, issueNumber, status, title, intro, publishedAt]
    IssueInput:
      type: object
      properties:
        issueDate:
          type: string
          format: date
        issueNumber:
          type: integer
        title:
          type: string
        intro:
          type: string
      required: [issueDate, issueNumber, title, intro]
    Story:
      type: object
      properties:
        id:
          type: integer
        issueId:
          type: integer
        topic:
          $ref: "#/components/schemas/Topic"
        kind:
          $ref: "#/components/schemas/StoryKind"
        state:
          type: string
          nullable: true
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
          nullable: true
        publishedOn:
          type: string
          format: date
          nullable: true
        eyebrow:
          type: string
        title:
          type: string
        dek:
          type: string
        body:
          type: string
        time:
          type: string
        read:
          type: integer
        tone:
          type: string
        number:
          type: integer
          nullable: true
        sortOrder:
          type: integer
        slug:
          type: string
        recordFamily:
          type: string
          enum: [articles, policies, cases, documents, states, data]
        canonicalPath:
          type: string
        indexable:
          type: boolean
        workflowStatus:
          $ref: "#/components/schemas/StoryWorkflowStatus"
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        verificationNotes:
          type: ["string", "null"]
        sourcePublishedOn:
          type: ["string", "null"]
          format: date
        sourceRetrievedOn:
          type: ["string", "null"]
          format: date
        lastVerifiedAt:
          type: ["string", "null"]
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        scheduledFor:
          type: ["string", "null"]
          format: date-time
        aiDisclosure:
          type: ["string", "null"]
        correctionNote:
          type: ["string", "null"]
      required: [id, issueId, topic, kind, state, source, sourceUrl, publishedOn, eyebrow, title, dek, body, time, read, tone, number, sortOrder, slug, recordFamily, canonicalPath, indexable, workflowStatus, verificationStatus, verificationNotes, sourcePublishedOn, sourceRetrievedOn, lastVerifiedAt, reviewedAt, scheduledFor, aiDisclosure, correctionNote]
    StoryInput:
      type: object
      properties:
        issueId:
          type: integer
        topic:
          $ref: "#/components/schemas/Topic"
        kind:
          $ref: "#/components/schemas/StoryKind"
        state:
          type: string
          nullable: true
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
          nullable: true
        publishedOn:
          type: string
          format: date
          nullable: true
        eyebrow:
          type: string
        title:
          type: string
        dek:
          type: string
        body:
          type: string
        time:
          type: string
        read:
          type: integer
        tone:
          type: string
        number:
          type: integer
          nullable: true
        sortOrder:
          type: integer
        workflowStatus:
          $ref: "#/components/schemas/StoryWorkflowStatus"
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        verificationNotes:
          type: ["string", "null"]
        sourcePublishedOn:
          type: ["string", "null"]
          format: date
        sourceRetrievedOn:
          type: ["string", "null"]
          format: date
        lastVerifiedAt:
          type: ["string", "null"]
          format: date-time
        scheduledFor:
          type: ["string", "null"]
          format: date-time
        aiDisclosure:
          type: ["string", "null"]
        correctionNote:
          type: ["string", "null"]
        revisionNote:
          type: ["string", "null"]
      required: [issueId, topic, kind, source, eyebrow, title, dek, body, time, read, tone, sortOrder]
    StoryRevision:
      type: object
      properties:
        id:
          type: integer
        storyId:
          type: integer
        revisionNumber:
          type: integer
        changeNote:
          type: ["string", "null"]
        snapshot:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required: [id, storyId, revisionNumber, changeNote, snapshot, createdAt]
    StoryRevisions:
      type: array
      items:
        $ref: "#/components/schemas/StoryRevision"
    CurrentIssue:
      type: object
      properties:
        issue:
          $ref: "#/components/schemas/Issue"
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
      required: [issue, stories, topics]
    ArchiveResult:
      type: object
      properties:
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/StoryKind"
        states:
          type: array
          items:
            type: string
      required: [stories, topics, kinds, states]
    PolicySource:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        sourceType:
          type: string
        publisher:
          type: string
        url:
          type: string
          format: uri
        publishedOn:
          type: ["string", "null"]
          format: date
        retrievedOn:
          type: string
          format: date
        isPrimary:
          type: boolean
      required: [id, title, sourceType, publisher, url, publishedOn, retrievedOn, isPrimary]
    PolicyRecord:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        canonicalPath:
          type: string
        title:
          type: string
        summary:
          type: string
        state:
          type: ["string", "null"]
        sector:
          type: string
        status:
          type: string
        authority:
          type: string
        previousFramework:
          type: string
        newFramework:
          type: string
        legalBasis:
          type: string
        courtStatus:
          type: string
        effectiveDate:
          type: ["string", "null"]
          format: date
        publishedOn:
          type: string
          format: date
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PolicySource"
      required: [id, slug, canonicalPath, title, summary, state, sector, status, authority, previousFramework, newFramework, legalBasis, courtStatus, effectiveDate, publishedOn, sources]
    PolicyListResult:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRecord"
        states:
          type: array
          items:
            type: string
        sectors:
          type: array
          items:
            type: string
        statuses:
          type: array
          items:
            type: string
      required: [records, states, sectors, statuses]
    LiveUpdate:
      type: object
      properties:
        id:
          type: string
        headline:
          type: string
        summary:
          type: string
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
        publishedAt:
          type: ["string", "null"]
          format: date-time
        observedAt:
          type: string
          format: date-time
        topic:
          type: string
          enum: [Latest, Courts & Policy, States, Ground Reports]
        status:
          type: string
          enum: [monitoring]
        reviewRequired:
          type: boolean
          enum: [true]
      required: [id, headline, summary, source, sourceUrl, publishedAt, observedAt, topic, status, reviewRequired]
    LiveFeed:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [ok, unavailable]
      required: [id, label, status]
    LiveUpdatesResult:
      type: object
      properties:
        updates:
          type: array
          items:
            $ref: "#/components/schemas/LiveUpdate"
        feeds:
          type: array
          items:
            $ref: "#/components/schemas/LiveFeed"
        observedAt:
          type: string
          format: date-time
      required: [updates, feeds, observedAt]
    NewsletterInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    NewsletterStatus:
      type: object
      properties:
        subscribed:
          type: boolean
        email:
          type: string
          format: email
      required: [subscribed, email]

