openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: publication
    description: Daily issue and story operations
  - name: newsletter
    description: Newsletter subscription operations
  - name: live desk
    description: Curated external monitoring feed
  - name: community
    description: India-wide public discussion space
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /issues/current:
    get:
      operationId: getCurrentIssue
      tags: [publication]
      summary: Get the current published issue
      responses:
        "200":
          description: Current published issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIssue"
        "404":
          description: No published issue exists
  /updates/live:
    get:
      operationId: getLiveUpdates
      tags: [live desk]
      summary: Get the current source monitoring feed
      description: Returns recent external feed items for monitoring. These are not published Signal 24 records and require editorial review before publication.
      responses:
        "200":
          description: Current monitoring items and feed health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveUpdatesResult"
  /community/posts:
    get:
      operationId: getCommunityPosts
      tags: [community]
      summary: Browse public community posts
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommunityTopic"
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommunityPostKind"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [recent, popular, trending, unanswered]
            default: recent
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Public community posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostList"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Ask a question or start a discussion, anonymously by default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Community post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
        "400":
          description: The post breaks the house rules
        "429":
          description: Too many posts from this participant in the last hour
  /community/posts/{postId}:
    get:
      operationId: getCommunityPost
      tags: [community]
      summary: Get a community post with replies
      parameters:
        - $ref: "#/components/parameters/CommunityPostId"
      responses:
        "200":
          description: Community post and replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostDetail"
        "404":
          description: Community post not found
  /community/posts/{postId}/replies:
    post:
      operationId: createCommunityReply
      tags: [community]
      summary: Reply to a community post
      parameters:
        - $ref: "#/components/parameters/CommunityPostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReplyInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReply"
  /community/posts/{postId}/like:
    post:
      operationId: toggleCommunityPostLike
      tags: [community]
      summary: Like or unlike a community post
      parameters:
        - $ref: "#/components/parameters/CommunityPostId"
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityLikeResponse"
  /community/posts/{postId}/report:
    post:
      operationId: reportCommunityPost
      tags: [community]
      summary: Report a community post; it is hidden after repeated reports
      parameters:
        - $ref: "#/components/parameters/CommunityPostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "200":
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportResponse"
  /community/replies/{replyId}/helpful:
    post:
      operationId: toggleCommunityReplyHelpful
      tags: [community]
      summary: Mark an answer helpful, or undo it
      parameters:
        - $ref: "#/components/parameters/CommunityReplyId"
      responses:
        "200":
          description: Updated helpful state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityHelpfulResponse"
  /community/replies/{replyId}/report:
    post:
      operationId: reportCommunityReply
      tags: [community]
      summary: Report an answer; it is hidden after repeated reports
      parameters:
        - $ref: "#/components/parameters/CommunityReplyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportInput"
      responses:
        "200":
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportResponse"
  /editor/issues/current:
    get:
      operationId: getEditorialIssue
      tags: [publication]
      summary: Get the current issue with editorial workflow fields
      responses:
        "200":
          description: Current issue for the editorial desk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIssue"
        "404":
          description: No issue exists
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/session:
    get:
      operationId: getEditorSession
      tags: [publication]
      summary: Get the signed-in editor identity
      responses:
        "200":
          description: Verified editor identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorSession"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /archive:
    get:
      operationId: getArchive
      tags: [publication]
      summary: Browse the reservation archive
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: topic
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Topic"
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StoryKind"
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Published reservation reporting and research archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveResult"
  /events:
    get:
      operationId: getEvidenceEvents
      tags: [evidence]
      summary: List published events and their explicit evidence relationships
      description: Returns published events only, with explicitly linked published articles and their stored source links. Draft event links and editor audit metadata are not included.
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Topic"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Published event records with explicitly linked articles and sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEventsResponse"
  /events/{eventId}:
    get:
      operationId: getEvidenceEvent
      tags: [evidence]
      summary: Get a published event and its explicit relationships
      description: Returns a published event only, with explicitly linked published articles and stored source links. Draft event links and editor audit metadata are not included.
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Published event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEventResponse"
        "404":
          description: Event not found
  /stories/{storyId}/evidence:
    get:
      operationId: getStoryEvidence
      tags: [evidence]
      summary: Get events and directly cited sources for a published article
      description: Returns explicitly linked published events and directly cited source documents for a published article. Draft records and inferred relationships are excluded.
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: Evidence relationships visible to the public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryEvidenceResponse"
        "404":
          description: Article not found
  /sources/{sourceId}:
    get:
      operationId: getSourceDocument
      tags: [evidence]
      summary: Get a source document and its explicit event and article links
      description: A source is public when explicitly linked to a published event or published article; returned events and cited articles include published records only.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Source document relationships visible to the public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocumentResponse"
        "404":
          description: Source document not found
  /evidence-search:
    get:
      operationId: searchEvidenceRecords
      tags: [evidence]
      summary: Search published articles, events, and source documents separately
      description: Searches published articles and events, plus sources explicitly linked to published events or published articles. Draft records and editor audit metadata are excluded.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results retain their article, event, or source type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSearchResponse"
  /editor/evidence:
    get:
      operationId: getEditorEvidence
      tags: [evidence, editor]
      summary: List evidence records and all stored relationships for editors
      description: Requires verified editor access. Includes draft records, all stored relationships, and editor-only audit metadata.
      responses:
        "200":
          description: Editorial evidence graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorEvidenceResponse"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/events:
    post:
      operationId: createEvidenceEvent
      tags: [evidence, editor]
      summary: Create an event record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEventRecord"
        "400":
          description: Invalid event
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/events/{eventId}:
    put:
      operationId: updateEvidenceEvent
      tags: [evidence, editor]
      summary: Update an event record
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceEventInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEventRecord"
        "404":
          description: Event not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
    delete:
      operationId: deleteEvidenceEvent
      tags: [evidence, editor]
      summary: Delete an event and cascade its relationship rows
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Event and its relationships deleted
        "404":
          description: Event not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/sources:
    post:
      operationId: createSourceDocument
      tags: [evidence, editor]
      summary: Create a source document record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDocumentInput"
      responses:
        "201":
          description: Created source document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocument"
        "400":
          description: Invalid source document
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/sources/{sourceId}:
    put:
      operationId: updateSourceDocument
      tags: [evidence, editor]
      summary: Update a source document record
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceDocumentInput"
      responses:
        "200":
          description: Updated source document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDocument"
        "404":
          description: Source document not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
    delete:
      operationId: deleteSourceDocument
      tags: [evidence, editor]
      summary: Delete a source document and cascade its relationship rows
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Source document and its relationships deleted
        "404":
          description: Source document not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/article-events:
    post:
      operationId: linkArticleToEvent
      tags: [evidence, editor]
      summary: Explicitly link an article to an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleEventLinkInput"
      responses:
        "201":
          description: Article-to-event relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRelationshipResult"
        "400":
          description: Invalid or duplicate relationship
        "404":
          description: Article or event not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/article-events/{eventId}/{storyId}:
    delete:
      operationId: unlinkArticleFromEvent
      tags: [evidence, editor]
      summary: Remove an explicit article-to-event relationship
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/StoryId"
      responses:
        "204":
          description: Relationship removed
        "404":
          description: Relationship not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/article-sources:
    post:
      operationId: linkArticleToSource
      tags: [evidence, editor]
      summary: Explicitly link an article directly to a source document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleSourceLinkInput"
      responses:
        "201":
          description: Article-to-source relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRelationshipResult"
        "400":
          description: Invalid or duplicate relationship
        "404":
          description: Article or source document not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/article-sources/{storyId}/{sourceId}:
    patch:
      operationId: updateArticleSourceRole
      tags: [evidence, editor]
      summary: Change the evidentiary role of a direct article source
      parameters:
        - $ref: "#/components/parameters/StoryId"
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleSourceRoleUpdate"
      responses:
        "200":
          description: Direct article-source role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleSourceRoleResult"
        "400":
          description: Invalid article or source id, or role
        "404":
          description: Relationship not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
    delete:
      operationId: unlinkArticleFromSource
      tags: [evidence, editor]
      summary: Remove an explicit direct article-to-source relationship
      parameters:
        - $ref: "#/components/parameters/StoryId"
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Relationship removed
        "404":
          description: Relationship not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/event-sources:
    post:
      operationId: linkSourceToEvent
      tags: [evidence, editor]
      summary: Explicitly link a source document to an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSourceLinkInput"
      responses:
        "201":
          description: Event-to-source relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRelationshipResult"
        "400":
          description: Invalid or duplicate relationship
        "404":
          description: Event or source document not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/event-sources/{eventId}/{sourceId}:
    delete:
      operationId: unlinkSourceFromEvent
      tags: [evidence, editor]
      summary: Remove an explicit event-to-source relationship
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Relationship removed
        "404":
          description: Relationship not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /policies:
    get:
      operationId: getPolicies
      tags: [publication]
      summary: Search the source-linked policy ledger
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: effectiveFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: effectiveTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Source-linked policy ledger records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyListResult"
  /policies/{slug}:
    get:
      operationId: getPolicy
      tags: [publication]
      summary: Get a policy ledger record by permanent slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Policy ledger record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyRecord"
        "404":
          description: Policy record not found
  /decision-impacts:
    get:
      operationId: getDecisionImpacts
      tags: [publication]
      summary: Browse source-backed migration and decision-impact evidence
      description: Returns published evidence by default. Only verified editors may request draft and review records with includeUnpublished.
      parameters:
        - name: evidenceType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DecisionImpactEvidenceType"
        - name: decisionArea
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DecisionImpactArea"
        - name: geography
          in: query
          required: false
          schema:
            type: string
        - name: includeUnpublished
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Migration and decision-impact evidence records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionImpactListResult"
        "401":
          description: Sign-in required to include unpublished records
        "403":
          description: Verified editor access required to include unpublished records
    post:
      operationId: createDecisionImpact
      tags: [publication]
      summary: Create a migration or decision-impact evidence record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionImpactInput"
      responses:
        "201":
          description: Evidence record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionImpactRecord"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /decision-impacts/{recordId}/revisions:
    get:
      operationId: getDecisionImpactRevisions
      tags: [publication]
      summary: Get the editorial revision history for a decision-impact record
      parameters:
        - $ref: "#/components/parameters/DecisionImpactId"
      responses:
        "200":
          description: Decision-impact revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionImpactRevisions"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Decision-impact record not found
  /decision-impacts/{recordId}:
    put:
      operationId: updateDecisionImpact
      tags: [publication]
      summary: Update a migration or decision-impact evidence record
      parameters:
        - $ref: "#/components/parameters/DecisionImpactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionImpactInput"
      responses:
        "200":
          description: Evidence record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionImpactRecord"
        "404":
          description: Evidence record not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /sitemap.xml:
    get:
      operationId: getPublicationSitemap
      tags: [publication]
      summary: Get the indexable publication sitemap
      responses:
        "200":
          description: XML sitemap containing only meaningful published records
          content:
            application/xml:
              schema:
                type: string
  /issues:
    post:
      operationId: createIssue
      tags: [publication]
      summary: Create a daily issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
      responses:
        "201":
          description: Created issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /issues/{issueId}/publish:
    post:
      operationId: publishIssue
      tags: [publication]
      summary: Publish an issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Published issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Issue not found
        "409":
          description: Issue contains records that have not passed editorial review
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /stories/{storyId}:
    get:
      operationId: getStory
      tags: [publication]
      summary: Get a story by id
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: Story details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Story not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
    put:
      operationId: updateStory
      tags: [publication]
      summary: Update a story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "200":
          description: Updated story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Story not found
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /stories/{storyId}/revisions:
    get:
      operationId: getStoryRevisions
      tags: [publication]
      summary: Get the revision history for a story
      parameters:
        - $ref: "#/components/parameters/StoryId"
      responses:
        "200":
          description: Revision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryRevisions"
        "404":
          description: Story not found
  /stories:
    post:
      operationId: createStory
      tags: [publication]
      summary: Add a story to an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /newsletter:
    post:
      operationId: subscribeToNewsletter
      tags: [newsletter]
      summary: Subscribe an email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "201":
          description: Newsletter subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterStatus"
  /editor/content-sources:
    get:
      operationId: getEditorContentSources
      tags: [editor, evidence]
      summary: List configured editorial source entries
      description: Requires verified editor access. This registry does not imply that automated crawling is active.
      responses:
        "200":
          description: Source registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorContentSourcesResponse"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
    post:
      operationId: createEditorContentSource
      tags: [editor, evidence]
      summary: Add a source to the editorial registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSourceInput"
      responses:
        "201":
          description: Source added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSourceRecord"
        "400":
          description: Invalid source entry
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "409":
          description: Domain is already registered
  /editor/content-sources/{sourceId}:
    put:
      operationId: updateEditorContentSource
      tags: [editor, evidence]
      summary: Update a source registry entry
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentSourceInput"
      responses:
        "200":
          description: Source updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentSourceRecord"
        "400":
          description: Invalid source entry
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Source not found
        "409":
          description: Domain is already registered
  /editor/discovery-items:
    get:
      operationId: getEditorDiscoveryItems
      tags: [editor, evidence]
      summary: List external leads for editorial review
      description: Requires verified editor access. Items are unpublished leads, not The Signal 24 reporting or evidence.
      responses:
        "200":
          description: Discovery queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorDiscoveryItemsResponse"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
    post:
      operationId: createEditorDiscoveryItem
      tags: [editor, evidence]
      summary: Add an external lead to the discovery queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryItemInput"
      responses:
        "201":
          description: Lead added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDiscoveryItem"
        "400":
          description: Invalid lead or source
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Source not found or disabled
        "409":
          description: URL is already in the discovery queue
  /editor/discovery-items/{itemId}:
    patch:
      operationId: updateEditorDiscoveryItem
      tags: [editor, evidence]
      summary: Update a lead's review status and notes
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryItemReviewInput"
      responses:
        "200":
          description: Lead review updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDiscoveryItem"
        "400":
          description: Invalid review update
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Lead not found
  /editor/discovery-items/{itemId}/promote:
    post:
      operationId: promoteEditorDiscoveryItem
      tags: [editor, evidence]
      summary: Promote a reviewed lead into an article draft
      description: Requires verified editor access. Creates an unpublished draft with source/date provenance; it does not link evidence or publish the article.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryItemPromotionInput"
      responses:
        "200":
          description: Reviewed lead linked to its new draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDiscoveryItem"
        "400":
          description: Invalid article draft
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Lead or issue not found
        "409":
          description: Lead must be reviewed and not already promoted
  /editor/image-search:
    post:
      operationId: searchEditorImageCandidates
      tags: [editor, evidence]
      summary: Search public image archive candidates
      description: Requires verified editor access. Search Wikimedia Commons, Internet Archive, or the Art Institute of Chicago. Results are suggestions only and are not saved, rights-approved, or published.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorImageCandidateSearchInput"
      responses:
        "200":
          description: Image search results with provider source and rights metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidateSearchResponse"
        "400":
          description: Invalid search request
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "502":
          description: The selected image archive is unavailable
  /editor/discovery-items/{itemId}/image-candidates:
    get:
      operationId: getEditorDiscoveryItemImageCandidates
      tags: [editor, evidence]
      summary: List image candidates for an external lead
      description: Requires verified editor access. Candidate records are not public and are not publication approvals.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Stored image candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidatesResponse"
        "400":
          description: Invalid lead ID
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Lead not found
    post:
      operationId: createEditorDiscoveryItemImageCandidate
      tags: [editor, evidence]
      summary: Save an archive result as an image candidate
      description: Requires verified editor access. The server re-fetches metadata from the selected archive; saved candidates start with rights review pending.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorImageCandidateCreateInput"
      responses:
        "201":
          description: Candidate saved for editor review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidate"
        "400":
          description: Invalid candidate request
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Lead or selected archive item not found
        "409":
          description: This archive image is already saved for the lead
        "502":
          description: The selected image archive is unavailable
  /editor/image-candidates/archive:
    get:
      operationId: getEditorImageCandidateArchive
      tags: [editor, evidence]
      summary: List removed image candidates with retained rights history
      description: Requires verified editor access. Includes candidates removed by an editor and candidates whose discovery lead was removed.
      responses:
        "200":
          description: Retained image candidates and rights history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidatesResponse"
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
  /editor/image-candidates/{candidateId}:
    delete:
      operationId: removeEditorImageCandidate
      tags: [editor, evidence]
      summary: Remove an image candidate without deleting rights history
      description: Requires verified editor access. Removal is retained as an archived record and does not delete rights history.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Candidate archived with rights history retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidate"
        "400":
          description: Invalid candidate ID
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Candidate not found
    patch:
      operationId: updateEditorImageCandidate
      tags: [editor, evidence]
      summary: Edit image credit and accessibility metadata
      description: Requires verified editor access. Changes to rights terms reset the rights review to pending.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorImageCandidateMetadataInput"
      responses:
        "200":
          description: Candidate metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidate"
        "400":
          description: Invalid candidate metadata
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Candidate not found
  /editor/image-candidates/{candidateId}/recheck:
    post:
      operationId: recheckEditorImageCandidateSource
      tags: [editor, evidence]
      summary: Compare a saved candidate with current archive terms
      description: Requires verified editor access. The provider-specific preview does not modify the saved candidate.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Current terms and fields that differ from the saved snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidateSourceRecheckPreview"
        "400":
          description: Invalid candidate ID
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Candidate or original archive image not found
        "502":
          description: The selected image archive is unavailable
  /editor/image-candidates/{candidateId}/recheck/apply:
    post:
      operationId: applyEditorImageCandidateSourceRecheck
      tags: [editor, evidence]
      summary: Apply a confirmed image-archive rights-metadata change
      description: Requires verified editor access. The server rechecks the selected provider against the preview; changed rights terms reset review to pending.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorImageCandidateSourceRecheckInput"
      responses:
        "200":
          description: Candidate after applying the confirmed source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidateSourceRecheckApplyResponse"
        "400":
          description: Invalid candidate or preview data
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Candidate or original archive image not found
        "409":
          description: Candidate or source metadata changed since the preview
        "502":
          description: The selected image archive is unavailable
  /editor/image-candidates/{candidateId}/rights:
    patch:
      operationId: reviewEditorImageCandidateRights
      tags: [editor, evidence]
      summary: Record an editor's image rights decision
      description: Requires verified editor access. Approval is an editor decision only; it does not publish or attach the image to an article.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorImageCandidateRightsReviewInput"
      responses:
        "200":
          description: Rights review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorImageCandidate"
        "400":
          description: Required metadata or review note is missing
        "401":
          description: Sign-in required
        "403":
          description: Verified editor access required
        "404":
          description: Candidate not found
components:
  parameters:
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    CommunityPostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    CommunityReplyId:
      name: replyId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    DecisionImpactId:
      name: recordId
      in: path
      required: true
      schema:
        type: integer
        format: int32
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Topic:
      type: string
      enum: [Latest, Courts & Policy, States, History, Ground Reports, Data & Notes]
    StoryKind:
      type: string
      enum: [Article, Paper note, Archive, Explainer, Opinion]
    StoryWorkflowStatus:
      type: string
      enum: [draft, review, scheduled, published, archived]
    VerificationStatus:
      type: string
      enum: [unverified, source-linked, verified]
    DecisionImpactEvidenceType:
      type: string
      enum: [lived-account, monitored-lead, quantified-finding]
    DecisionImpactArea:
      type: string
      enum: [migration, study, work, applications, staying, speaking, leaving]
    DecisionImpactWorkflowStatus:
      type: string
      enum: [draft, review, published, archived]
    EvidenceEventWorkflowStatus:
      type: string
      enum: [draft, published, archived]
    EvidenceSourceStatus:
      type: string
      enum: [verified, unverified, archived, unavailable]
    EvidenceDocumentType:
      type: string
      enum: [official-document, court-record, government-data, report, news-report, other]
    EvidenceSourceRole:
      type: string
      enum: [primary, secondary]
    EvidenceResultType:
      type: string
      enum: [article, event, source]
    Issue:
      type: object
      properties:
        id:
          type: integer
        issueDate:
          type: string
          format: date
        issueNumber:
          type: integer
        status:
          type: string
          enum: [draft, published]
        title:
          type: string
        intro:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, issueDate, issueNumber, status, title, intro, publishedAt]
    IssueInput:
      type: object
      properties:
        issueDate:
          type: string
          format: date
        issueNumber:
          type: integer
        title:
          type: string
        intro:
          type: string
      required: [issueDate, issueNumber, title, intro]
    StoryTranslation:
      type: object
      description: Hindi edition of a record. Only fields that have been translated and reviewed are present.
      properties:
        eyebrow:
          type: string
        title:
          type: string
        dek:
          type: string
        body:
          type: string
      required: [title, dek, body]
    PolicyTranslation:
      type: object
      description: Hindi edition of a policy ledger record.
      properties:
        title:
          type: string
        summary:
          type: string
        sector:
          type: string
        authority:
          type: string
        previousFramework:
          type: string
        newFramework:
          type: string
        legalBasis:
          type: string
        courtStatus:
          type: string
      required: [title, summary]
    Story:
      type: object
      properties:
        id:
          type: integer
        issueId:
          type: integer
        topic:
          $ref: "#/components/schemas/Topic"
        kind:
          $ref: "#/components/schemas/StoryKind"
        state:
          type: string
          nullable: true
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
          nullable: true
        publishedOn:
          type: string
          format: date
          nullable: true
        recordDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        articlePublishedAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time
          description: When the record's content last changed (an edit, a dated update or a byline change). Feeds dateModified and sitemap lastmod.
        eventCount:
          type: integer
          minimum: 0
        sourceCount:
          type: integer
          minimum: 0
        eyebrow:
          type: string
        title:
          type: string
        dek:
          type: string
        body:
          type: string
        time:
          type: string
        read:
          type: integer
        tone:
          type: string
        number:
          type: integer
          nullable: true
        sortOrder:
          type: integer
        slug:
          type: string
        recordFamily:
          type: string
          enum: [articles, policies, cases, documents, states, data]
        canonicalPath:
          type: string
        indexable:
          type: boolean
        workflowStatus:
          $ref: "#/components/schemas/StoryWorkflowStatus"
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        verificationNotes:
          type: ["string", "null"]
        sourcePublishedOn:
          type: ["string", "null"]
          format: date
        sourceRetrievedOn:
          type: ["string", "null"]
          format: date
        lastVerifiedAt:
          type: ["string", "null"]
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        scheduledFor:
          type: ["string", "null"]
          format: date-time
        aiDisclosure:
          type: ["string", "null"]
        correctionNote:
          type: ["string", "null"]
        byline:
          type: ["string", "null"]
          description: Named author or desk for opinion and signed pieces.
        hi:
          oneOf:
            - $ref: "#/components/schemas/StoryTranslation"
            - type: "null"
      required: [id, issueId, topic, kind, state, source, sourceUrl, publishedOn, recordDate, articlePublishedAt, eyebrow, title, dek, body, time, read, tone, number, sortOrder, slug, recordFamily, canonicalPath, indexable, workflowStatus, verificationStatus, verificationNotes, sourcePublishedOn, sourceRetrievedOn, lastVerifiedAt, reviewedAt, scheduledFor, aiDisclosure, correctionNote, byline, hi]
    StoryInput:
      type: object
      properties:
        issueId:
          type: integer
        topic:
          $ref: "#/components/schemas/Topic"
        kind:
          $ref: "#/components/schemas/StoryKind"
        state:
          type: string
          nullable: true
        source:
          type: string
        sourceUrl:
          type: string
          format: uri
          nullable: true
        publishedOn:
          type: string
          format: date
          nullable: true
        eyebrow:
          type: string
        title:
          type: string
        dek:
          type: string
        body:
          type: string
        time:
          type: string
        read:
          type: integer
        tone:
          type: string
        number:
          type: integer
          nullable: true
        sortOrder:
          type: integer
        workflowStatus:
          $ref: "#/components/schemas/StoryWorkflowStatus"
        verificationStatus:
          $ref: "#/components/schemas/VerificationStatus"
        verificationNotes:
          type: ["string", "null"]
        sourcePublishedOn:
          type: ["string", "null"]
          format: date
        sourceRetrievedOn:
          type: ["string", "null"]
          format: date
        lastVerifiedAt:
          type: ["string", "null"]
          format: date-time
        scheduledFor:
          type: ["string", "null"]
          format: date-time
        aiDisclosure:
          type: ["string", "null"]
        correctionNote:
          type: ["string", "null"]
        revisionNote:
          type: ["string", "null"]
        byline:
          type: ["string", "null"]
        hi:
          oneOf:
            - $ref: "#/components/schemas/StoryTranslation"
            - type: "null"
      required: [issueId, topic, kind, source, eyebrow, title, dek, body, time, read, tone, sortOrder]
    StoryRevision:
      type: object
      properties:
        id:
          type: integer
        storyId:
          type: integer
        revisionNumber:
          type: integer
        changeNote:
          type: ["string", "null"]
        snapshot:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required: [id, storyId, revisionNumber, changeNote, snapshot, createdAt]
    StoryRevisions:
      type: array
      items:
        $ref: "#/components/schemas/StoryRevision"
    CurrentIssue:
      type: object
      properties:
        issue:
          $ref: "#/components/schemas/Issue"
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
      required: [issue, stories, topics]
    ArchiveResult:
      type: object
      properties:
        stories:
          type: array
          items:
            $ref: "#/components/schemas/Story"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/StoryKind"
        states:
          type: array
          items:
            type: string
      required: [stories, topics, kinds, states]
    EvidenceEventRecord:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        topic:
          $ref: "#/components/schemas/Topic"
        recordDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        summary:
          type: string
        workflowStatus:
          $ref: "#/components/schemas/EvidenceEventWorkflowStatus"
      required: [id, title, topic, recordDate, summary, workflowStatus]
    EvidenceEventInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        topic:
          $ref: "#/components/schemas/Topic"
        recordDate:
          type: ["string", "null"]
          format: date
        summary:
          type: string
        workflowStatus:
          $ref: "#/components/schemas/EvidenceEventWorkflowStatus"
      required: [title, topic, summary]
    SourceDocument:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        publisher:
          type: string
        publicationDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
        documentType:
          $ref: "#/components/schemas/EvidenceDocumentType"
        sourceUrl:
          type: ["string", "null"]
          format: uri
        status:
          $ref: "#/components/schemas/EvidenceSourceStatus"
      required: [id, title, publisher, publicationDate, documentType, sourceUrl, status]
    SourceDocumentInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        publisher:
          type: string
          minLength: 1
        publicationDate:
          type: ["string", "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
