<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A filing cabinet drawer holding the Rohini Commission report, locked, tagged submitted 31 July 2023, stamped withheld">
<defs>
