<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A promotion ladder with grades A to G beside an empty cadre data sheet and a tape measure labelled count, with years 2006, 2018 and 2022">
