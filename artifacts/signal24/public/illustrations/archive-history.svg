<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Three archival sheets pinned and linked by red thread: Kolhapur 1902, Madras 1921 and the Poona Pact 1932">
