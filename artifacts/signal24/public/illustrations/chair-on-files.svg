<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="An empty government office chair with a white towel on its backrest, sitting on a tall stack of files labelled SECC 2011, Rohini report, creamy layer 2017 and cadre data, stamped no data">
