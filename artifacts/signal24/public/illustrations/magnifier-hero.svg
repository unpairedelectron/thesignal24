<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A magnifying glass held over a stack of notifications, affidavits and judgments, next to a pile of press releases">
<defs>
  <filter id="grain-mh" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0.07 0"/>
  </filter>
  <pattern id="dots-mh" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
    <circle cx="4" cy="4" r="2.4" fill="#342a23" opacity="0.18"/>
  </pattern>
  <pattern id="dots-red-mh" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
    <circle cx="3" cy="3" r="2.2" fill="#a5352a" opacity="0.35"/>
  </pattern>
  <pattern id="lines-mh" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="#342a23" stroke-width="2" opacity="0.12"/>
  </pattern>
