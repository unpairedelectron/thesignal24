        <h1>The Signal 24 — Power, on the record</h1>
        <p>A public-interest newsroom that holds India’s governments, courts, commissions and agencies to their own records on reservation and representation. Every claim is linked to its source. For the people, by the people.</p>
        <h2>Our standards</h2>
        <ul>
          <li><strong>Reporting:</strong> what happened, who did it and when, with the document that proves it. Allegations stay allegations until the record establishes them.</li>
          <li><strong>Right of reply:</strong> before publishing a finding against a named office or official, we ask for their response and record whether they gave one.</li>
          <li><strong>Opinion:</strong> labelled, signed, and kept separate from reporting. We criticise institutions and decisions, not communities.</li>
          <li><strong>Corrections:</strong> made in public, with the date and what changed.</li>
        </ul>
        <p>Live-desk items are unreviewed outside leads. Community posts are participant contributions. Neither is Signal 24 reporting.</p>
