        <h1>The Signal 24 — India, on the record</h1>
        <p>The Signal 24 is India’s reservation and representation monitor: a public-interest newsroom and research archive for policy, courts, documents, data and the histories behind them. It covers UGC equity rules, open-category competition, EWS eligibility and state reservation disputes.</p>
        <h2>Editorial standards</h2>
        <p>Every claim has a source. Every number has a document. We distinguish reporting, documents, analysis and opinion so a reader can tell what kind of record they are reading.</p>
        <ul>
          <li><strong>Reporting:</strong> what happened, attributed to a source and dated.</li>
          <li><strong>Documents:</strong> what an original source says. Court orders, government notifications, commission reports and statutory text should be linked or identified wherever possible.</li>
          <li><strong>Analysis:</strong> what the available evidence suggests, with its method shown and uncertainty preserved.</li>
          <li><strong>Opinion:</strong> a clearly labelled viewpoint with an identified author and relevant disclosure.</li>
        </ul>
        <p>Unreviewed items from external feeds are leads, not Signal 24 reporting. Public participant contributions are labelled separately.</p>
