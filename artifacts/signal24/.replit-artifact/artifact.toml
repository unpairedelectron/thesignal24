kind = "web"
previewPath = "/"
title = "The Signal 24"
description = "An editorial news and policy desk tracking Indian court proceedings, UGC equity regulations, open-category competition, EWS eligibility, and state reservation rules. It links to primary records and sourced external reporting without presenting unreviewed leads as Signal 24 reporting."
version = "1.0.0"
id = "artifacts/signal24"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22481

[services.development]
run = "pnpm --filter @workspace/signal24 run dev"

# Production runs the page server (server/index.ts, built to dist/server/index.mjs).
# It serves dist/public and renders every page URL with its real title, canonical,
# structured data, text and status code, so search engines can index the site
# without running JavaScript. Unknown addresses get a real 404.
[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/signal24", "run", "build"]

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/signal24/dist/server/index.mjs"]

[services.production.run.env]
PORT = "22481"
NODE_ENV = "production"
# The API service of this deployment (artifacts/api-server, localPort 8080).
API_ORIGIN = "http://127.0.0.1:8080"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "22481"
BASE_PATH = "/"
