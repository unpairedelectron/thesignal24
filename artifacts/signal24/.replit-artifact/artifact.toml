kind = "web"
previewPath = "/"
title = "The Signal 24"
description = "An editorial news and policy desk tracking Indian court proceedings, UGC equity regulations, open-category competition, EWS eligibility, and state reservation rules. It links to primary records and sourced external reporting without presenting unreviewed leads as Signal 24 reporting."
version = "1.0.0"
id = "artifacts/signal24"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22481

[services.development]
run = "pnpm --filter @workspace/signal24 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/signal24", "run", "build" ]
serve = "static"
publicDir = "artifacts/signal24/dist/public"

[[services.production.rewrites]]
from = "/hi"
to = "/hi/index.html"

[[services.production.rewrites]]
from = "/states"
to = "/states/index.html"

[[services.production.rewrites]]
from = "/hi/states"
to = "/hi/states/index.html"

[[services.production.rewrites]]
from = "/state/*"
to = "/state/*/index.html"

[[services.production.rewrites]]
from = "/hi/state/*"
to = "/hi/state/*/index.html"

[[services.production.rewrites]]
from = "/articles/*"
to = "/articles/*/index.html"

[[services.production.rewrites]]
from = "/data/*"
to = "/data/*/index.html"

[[services.production.rewrites]]
from = "/states/*"
to = "/states/*/index.html"

[[services.production.rewrites]]
from = "/documents/*"
to = "/documents/*/index.html"

[[services.production.rewrites]]
from = "/cases/*"
to = "/cases/*/index.html"

[[services.production.rewrites]]
from = "/policies/*"
to = "/policies/*/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22481"
BASE_PATH = "/"
